<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="طالب بوزوك">
<title>طالب بوزوك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="topbar">
  <span class="app-name" id="appName">طالب بوزوك</span>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="ar">عربي</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="tr">TR</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" aria-label="التنقل">
  <button class="tab" data-tab="today" aria-label="اليوم">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
    <span data-i18n-tab="today">اليوم</span>
  </button>
  <button class="tab" data-tab="week" aria-label="الأسبوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg>
    <span data-i18n-tab="week">الأسبوع</span>
  </button>
  <button class="tab" data-tab="assignments" aria-label="الواجبات">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m9.6 12.6 1.8 1.8 3.4-3.6"/></svg>
    <span data-i18n-tab="assignments">الواجبات</span>
  </button>
  <button class="tab" data-tab="courses" aria-label="المواد">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5V5.5M20 18H8"/></svg>
    <span data-i18n-tab="courses">المواد</span>
  </button>
  <button class="tab" data-tab="schedule" aria-label="جدولي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5 3.5 19.5l1-4Z"/></svg>
    <span data-i18n-tab="schedule">جدولي</span>
  </button>
</nav>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
